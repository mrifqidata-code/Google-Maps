name: Monitor review

on:
  schedule:
    # Setiap hari pukul 06.17 WIB (23.17 UTC). Jadwal hanya berjalan di default branch.
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Satu grup dengan workflow "Kelola cabang" supaya tidak ada dua job yang menulis data bersamaan.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ambil rating dan ulasan (bergiliran sesuai kuota SerpApi)
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python3 -m monitor fetch

      - name: Simpan data ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/centers.json docs/data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "Update data review $(TZ=Asia/Jakarta date +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
